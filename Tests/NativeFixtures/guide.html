<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Clicky scratch guide fixture</title>
<style>
body { font: 20px system-ui; max-width: 700px; margin: 70px auto; background: #f3f6fb; color: #18253d; }
button, input { font: inherit; padding: 12px; margin: 8px 0; }
section { background: white; padding: 24px; border-radius: 16px; }
output { display: block; margin: 18px 0; font-weight: 700; }
</style>
<h1>Clicky scratch fixture</h1>
<p>Goal: open the settings panel, set Quantity to 12, and apply it.</p>
<button id="open" aria-controls="panel" aria-expanded="false">Open settings panel</button>
<section id="panel" hidden>
<h2>Settings panel</h2>
<form id="form">
<label for="quantity">Quantity</label><br>
<input id="quantity" name="quantity" type="number" value="1" autocomplete="off">
<br><button type="submit">Apply quantity</button>
</form>
<output id="result" aria-live="polite">No changes applied</output>
</section>
<script>
const openButton = document.querySelector('#open');
openButton.addEventListener('click', () => {
    document.querySelector('#panel').hidden = false;
    openButton.setAttribute('aria-expanded', 'true');
});
document.querySelector('#form').addEventListener('submit', event => {
    event.preventDefault();
    document.querySelector('#result').textContent = 'Applied quantity: ' + document.querySelector('#quantity').value;
    document.querySelector('#quantity').blur();
});
</script>
</html>
